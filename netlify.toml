[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"

[[edge_functions]]
  path = "/api/ar-proxy"
  function = "ar-proxy"

[[edge_functions]]
  path = "/api/ar-proxy/*"
  function = "ar-proxy"

[[redirects]]
  from = "/api/ar-proxy"
  to = "/.netlify/functions/ar-proxy"
  status = 200
  force = false

[[redirects]]
  from = "/api/ar-proxy/*"
  to = "/.netlify/functions/ar-proxy"
  status = 200
  force = false

[[redirects]]
  from = "/api/litterbox"
  to = "https://litterbox.catbox.moe/resources/internals/api.php"
  status = 200
  force = true

[[redirects]]
  from = "/api/uguu"
  to = "https://uguu.se/upload"
  status = 200
  force = true

[[redirects]]
  from = "/api/proxy/*"
  to = "https://tmpfiles.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/catbox"
  to = "https://catbox.moe/user/api.php"
  status = 200
  force = true

[[redirects]]
  from = "/api/proxy-catbox/*"

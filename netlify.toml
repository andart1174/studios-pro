  to = "/404.html"
  status = 404

# ─── SECURITY & SEO HEADERS ────────────────────────────────────────────
# Allow iframe embedding across external websites (WordPress, blogs, tools, online viewers)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy-Report-Only = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src 'self' https://js.stripe.com https://checkout.stripe.com;"
Permissions-Policy = "camera=*, xr-spatial-tracking=*, microphone=(self), display-capture=(self), autoplay=*, fullscreen=*"


# Aggressive caching for immutable hashed JS/CSS (browser won't re-download)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images and fonts for 30 days
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Sitemap — fresh every 24h
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Exclude utility & internal error endpoints from search indexing
[[headers]]
  for = "/contact.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/apps/ia-architecte/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/apps/scripting-live/viewer.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# =====================================================
# 🔮 AR / 3D MODEL HEADERS — REQUIRED FOR GOOGLE SCENVIEWER & IOS QUICKLOOK
# Without these, Google SceneViewer (Android AR) silently refuses to show the model
# =====================================================

# GLB files — correct MIME type + CORS for SceneViewer & QuickLook
[[headers]]
  for = "/ar/models/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "public, max-age=3600"

# GLTF JSON files
[[headers]]
  for = "/ar/models/*.gltf"
  [headers.values]
    Content-Type = "model/gltf+json"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=3600"

# USDZ files for iOS QuickLook
[[headers]]
  for = "/ar/models/*.usdz"
  [headers.values]
    Content-Type = "model/vnd.usdz+zip"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# AR viewer page — no cache so updates deploy instantly
[[headers]]
  for = "/ar/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# AR viewer app — completely un-cached for instant updates on mobile
[[headers]]
  for = "/apps/ar-viewer/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Cache local AR Viewer vendor scripts & workers for fast repeat opens
[[headers]]
  for = "/apps/ar-viewer/vendor/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=2592000"

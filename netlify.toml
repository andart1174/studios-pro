[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/api/proxy/*"
  to = "https://tmpfiles.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/catbox"
  to = "https://catbox.moe/user/api.php"
  status = 200
  force = true

# Static HTML pages — serve them as-is (MUST be before the SPA catch-all)
[[redirects]]
  from = "/faq.html"
  to = "/faq.html"
  status = 200
  force = false

[[redirects]]
  from = "/contact.html"
  to = "/contact.html"
  status = 200
  force = false

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/viewer/*"
  to = "/viewer/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/convert/*"
  to = "/convert/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/ar-viewer/*"
  to = "/ar-viewer/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/apps/*"
  to = "/apps/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/cards/*"
  to = "/cards/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/tools/*"
  to = "/tools/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/compare/*"
  to = "/compare/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/community"
  to = "/community/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/community/map"
  to = "/community/map.html"
  status = 200
  force = false

[[redirects]]
  from = "/community/map/"
  to = "/community/map.html"
  status = 200
  force = false

[[redirects]]
  from = "/community/u/:uid"
  to = "/community/profile.html?u=:uid"
  status = 200
  force = false

[[redirects]]
  from = "/community/post/:id"
  to = "/community/post.html?id=:id"
  status = 200
  force = false

[[redirects]]
  from = "/community/post/"
  to = "/community/post.html"
  status = 200
  force = false

[[redirects]]
  from = "/community/*"
  to = "/community/:splat"
  status = 200
  force = false

# SPA catch-all — React app for everything else
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── SECURITY & SEO HEADERS ────────────────────────────────────────────
# These headers improve Google ranking (Core Web Vitals + Security signals)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Aggressive caching for immutable hashed JS/CSS (browser won't re-download)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images and fonts for 30 days
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Sitemap — fresh every 24h
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Disable cache for community real-time pages
[[headers]]
  for = "/community/share-bridge.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/community/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"


# =====================================================
# 🔮 AR / 3D MODEL HEADERS — REQUIRED FOR GOOGLE SCENVIEWER & IOS QUICKLOOK
# Without these, Google SceneViewer (Android AR) silently refuses to show the model
# =====================================================

# GLB files — correct MIME type + CORS for SceneViewer & QuickLook
[[headers]]
  for = "/ar/models/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "public, max-age=3600"

# GLTF JSON files
[[headers]]
  for = "/ar/models/*.gltf"
  [headers.values]
    Content-Type = "model/gltf+json"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=3600"

# USDZ files for iOS QuickLook
[[headers]]
  for = "/ar/models/*.usdz"
  [headers.values]
    Content-Type = "model/vnd.usdz+zip"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# AR viewer page — no cache so updates deploy instantly
[[headers]]
  for = "/ar/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=0, must-revalidate"

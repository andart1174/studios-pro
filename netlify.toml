[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "true"

[[edge_functions]]
  path = "/api/ar-share"
  function = "ar-share"

[[edge_functions]]
  path = "/api/ar-share/*"
  function = "ar-share"

[[edge_functions]]
  path = "/api/ar-proxy"
  function = "ar-proxy"

[[edge_functions]]
  path = "/api/ar-proxy/*"
  function = "ar-proxy"

[[redirects]]
  from = "/api/verify-session"
  to = "/.netlify/functions/verify-session"
  status = 200
  force = false


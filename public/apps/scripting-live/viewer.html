<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studios-Pro — Shared 3D Script Viewer v5.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: #070c1c; color: #f8fafc; overflow: hidden; height: 100vh; }
    #stage { width: 100vw; height: 100vh; position: relative; }
    #html-frame { display: none; width: 100vw; height: 100vh; border: none; background: #fff; }
    .topbar {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 20;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    }
    .pill {
      pointer-events: auto; background: rgba(10, 16, 36, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 8px 14px;
      display: flex; align-items: center; gap: 10px; font-size: 0.82rem; font-weight: 700; color: #fff;
      text-decoration: none;
    }
    .pill:hover { border-color: #38bdf8; }
    .hud {
      position: fixed; bottom: 18px; right: 18px; z-index: 20; width: 250px;
      background: rgba(10, 16, 36, 0.86); backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 14px; padding: 14px;
      display: flex; flex-direction: column; gap: 8px; max-height: 75vh; overflow-y: auto;
    }
    .hud h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.76rem; color: #cbd5e1; }
    .row input[type="range"] { flex: 1; accent-color: #38bdf8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="topbar">
    <a id="edit-link" class="pill" href="./index.html">← Open in Scripting Studio</a>
    <div id="stats-pill" class="pill" style="color:#38bdf8;">Studios-Pro 3D Viewer v5</div>
  </div>
  <div id="stage"></div>
  <iframe id="html-frame" sandbox="allow-scripts"></iframe>
  <div id="hud" class="hud">
    <h3>Live Parameters</h3>
    <div id="params-box" style="display:flex;flex-direction:column;gap:6px;"></div>
    <div class="row"><span>Auto Rotate</span><input type="checkbox" id="auto-rot" checked></div>
  </div>

  <script src="./js/engine3d.js?v=5"></script>
  <script src="./js/templates.js?v=5"></script>
  <script>
    (function () {
      const hash = window.location.hash || '';
      const paramsBox = document.getElementById('params-box');
      const statsPill = document.getElementById('stats-pill');
      const editLink = document.getElementById('edit-link');
      editLink.href = './index.html' + hash;

      let state = null;
      if (hash.startsWith('#state=')) {
        try {
          const b64 = hash.slice(7);
          const json = decodeURIComponent(escape(atob(b64)));
          state = JSON.parse(json);
        } catch (e) { console.error('Share decode error:', e); }
      }

      const code = (state && state.c) ? state.c : ScriptingTemplates.getById('planetaryGearbox').code;

      // Safe sandboxed HTML mode support!
      if (/^\s*<!doctype|^\s*<html/i.test(code)) {
        document.getElementById('stage').style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        const fr = document.getElementById('html-frame');
        fr.style.display = 'block';
        fr.srcdoc = code;
        statsPill.textContent = 'HTML5 Live Sandbox';
        return;
      }

      ScriptingEngine3D.init(document.getElementById('stage'), {
        onStats: (st) => { statsPill.textContent = `${st.meshes} meshes • ${st.triangles.toLocaleString()} tris`; },
        onParamsChanged: (list) => {
          paramsBox.textContent = '';
          list.forEach(p => {
            const row = document.createElement('div');
            row.className = 'row';
            const lbl = document.createElement('span');
            lbl.textContent = String(p.name || '');
            if (p.type === 'color') {
              const inp = document.createElement('input');
              inp.type = 'color';
              inp.value = /^#[0-9a-f]{6}$/i.test(String(p.value || '')) ? p.value : '#38bdf8';
              inp.oninput = e => ScriptingEngine3D.setParamValue(p.name, e.target.value);
              row.append(lbl, inp);
            } else {
              const inp = document.createElement('input');
              inp.type = 'range';
              inp.min = String(p.min); inp.max = String(p.max); inp.step = String(p.step); inp.value = String(p.value);
              const val = document.createElement('span');
              val.style.cssText = 'min-width:28px;text-align:right;color:#38bdf8;';
              val.textContent = String(p.value);
              inp.oninput = e => { const v = parseFloat(e.target.value); val.textContent = String(v); ScriptingEngine3D.setParamValue(p.name, v); };
              row.append(lbl, inp, val);
            }
            paramsBox.appendChild(row);
          });
        }
      });

      if (state && state.st) ScriptingEngine3D.applySceneStyle(state.st);
      if (state && state.mc) ScriptingEngine3D.setDefaultModelColor(state.mc);
      if (state && state.bc) ScriptingEngine3D.setBackgroundColor(state.bc);
      const ar = state && state.ar !== undefined ? !!state.ar : true;
      document.getElementById('auto-rot').checked = ar;
      ScriptingEngine3D.setAutoRotate(ar);
      document.getElementById('auto-rot').onchange = e => ScriptingEngine3D.setAutoRotate(e.target.checked);

      // Security guard: never auto-execute untrusted shared JS on studios-pro.com without explicit user click
      if (state && state.c) {
        const banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;inset:0;z-index:50;background:rgba(7,12,28,0.92);display:flex;align-items:center;justify-content:center;padding:24px;';
        const card = document.createElement('div');
        card.style.cssText = 'max-width:440px;background:#0f172a;border:1px solid rgba(56,189,248,0.4);border-radius:16px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:14px;';
        const h = document.createElement('h2');
        h.style.cssText = 'font-size:1.05rem;color:#38bdf8;';
        h.textContent = 'Shared 3D Script Preview';
        const p = document.createElement('p');
        p.style.cssText = 'font-size:0.84rem;color:#cbd5e1;line-height:1.5;';
        p.textContent = 'This link contains a custom 3D script shared by another user. Click below only if you trust the sender.';
        const btn = document.createElement('button');
        btn.style.cssText = 'background:linear-gradient(135deg,#06b6d4,#8b5cf6);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;';
        btn.textContent = 'Run Shared 3D Script';
        btn.onclick = () => { banner.remove(); ScriptingEngine3D.runScript(code, { resetParams: true }); };
        card.append(h, p, btn);
        banner.appendChild(card);
        document.body.appendChild(banner);
      } else {
        ScriptingEngine3D.runScript(code, { resetParams: true });
      }
      window.addEventListener('resize', () => ScriptingEngine3D.resize());
    })();
  </script>
</body>
</html>
